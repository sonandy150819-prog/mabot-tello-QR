<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEXCO 마봇·텔로 대기줄</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f3f4f6; padding: 20px; }
    .box { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 14px; }
    button { padding: 12px 16px; font-size: 15px; font-weight: bold; margin: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>마봇·텔로 체험 대기표</h2>
    <p>1. 체험 선택</p>
    <button onclick="pick('마봇')">마봇</button>
    <button onclick="pick('텔로')">텔로</button>
    <div id="sub"></div>
    <p><input id="nameInput" placeholder="성함 (필수)" style="padding:10px; width:100%; box-sizing:border-box;" /></p>
    <button onclick="submitForm()" style="width:100%; background:#2563eb; color:#fff; border:none; border-radius:10px;">대기번호 받기</button>
    <p id="result" style="font-weight:bold; color:#1d4ed8;"></p>
    <p>오픈채팅: <a href="https://open.kakao.com/o/gZ0NITYi" target="_blank">https://open.kakao.com/o/gZ0NITYi</a></p>
  </div>
  <script>
    let mainPick = "";
    let subPick = "";
    function pick(item) {
      mainPick = item;
      subPick = "";
      const list = item === "마봇" ? ["직접 만들기", "완성품 체험하기"] : ["코딩", "조종"];
      document.getElementById("sub").innerHTML = "<p>2. " + item + " 세부 선택</p>" +
        list.map(x => `<button onclick="subPick='${x}'; document.getElementById('result').innerText='선택: ${item} - ${x}'">${x}</button>`).join("");
    }
    function submitForm() {
      const name = document.getElementById("nameInput").value.trim();
      if (!mainPick || !subPick) return alert("마봇/텔로와 세부 항목을 선택해 주세요.");
      if (!name) return alert("성함은 필수입니다.");
      document.getElementById("result").innerText = name + "님 완료 (" + mainPick + " / " + subPick + ")";
    }
  </script>
</body>
</html>
